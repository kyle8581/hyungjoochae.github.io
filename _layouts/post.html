---
layout: default
---

<head>
	<title>{{ page.title }} - Hyungjoo Chae</title>
</head>

<div class="docs-section" id="post">
  <div class="post-header">
    <h4>{{ page.title }}</h4>
    <div class="post-meta">
      <span class="post-date">{{ page.date | date: "%B %d, %Y" }}</span>
      {% if page.author %}
        <span class="post-author">by {{ page.author }}</span>
      {% endif %}
    </div>
    {% if page.tags %}
      <div class="post-tags">
        {% for tag in page.tags %}
          <span class="tag">{{ tag }}</span>
        {% endfor %}
      </div>
    {% endif %}
  </div>

  <div class="post-content">
    {{ content }}
  </div>

  <div class="post-footer">
    <hr>
    <a href="{{ site.baseurl }}/blog" class="back-to-blog">← Back to Blog</a>
  </div>
</div>
